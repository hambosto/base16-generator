[project]
name = "base16-generator"
version = "0.1.0"
description = "Base16 palette from an image via OKLCH hue voting."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Ilham Putra Husada", email = "106536348+hambosto@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "pillow>=13.0.0",
]

[project.scripts]
base16-generator = "base16_generator.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "mypy>=1.18.0",
    "ruff>=0.12.0",
    "vulture>=2.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true

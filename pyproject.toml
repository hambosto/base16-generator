[project]
name = "base16-generator"
version = "0.1.0"
description = "Base16 palette from an image via OKLCH constrained k-means."
readme = "README.md"
authors = [
    { name = "Ilham Putra Husada", email = "106536348+hambosto@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "pillow>=13.0.0",
]

[project.scripts]
base16-generator = "base16_generator.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
